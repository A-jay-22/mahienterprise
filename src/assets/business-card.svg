<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="70%" stop-color="#111E38"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
    <linearGradient id="cardAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="bcShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#bcShadow)">
    <!-- Business Card Outer Border & Card Body -->
    <rect x="15" y="15" width="620" height="350" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2"/>

    <!-- Decorative Top Edge Ribbon -->
    <rect x="15" y="15" width="620" height="8" rx="4" fill="url(#cardAccent)"/>

    <!-- Left Emblem & Company Brand Header -->
    <g transform="translate(45, 45)">
      <!-- Logo Mark -->
      <rect x="0" y="0" width="55" height="55" rx="14" fill="#162238" stroke="#3B82F6" stroke-width="1.5"/>
      <path d="M12 38 A18 18 0 0 1 27.5 10" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M27.5 10 A18 18 0 0 1 43 38" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="27.5" cy="28" r="9" fill="#1D4ED8"/>
      <circle cx="27.5" cy="28" r="3" fill="#FFFFFF"/>

      <text x="70" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="1" fill="#FFFFFF">MAHI ENTERPRISE</text>
      <text x="70" y="50" font-family="'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="0.5" fill="#38BDF8">SPEED GOVERNOR &amp; GPS TRACKING SOLUTIONS</text>
    </g>

    <!-- Services Highlight Checklist Box -->
    <g transform="translate(45, 125)">
      <rect x="0" y="0" width="280" height="150" rx="10" fill="#162238" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#EA580C" letter-spacing="1">SPECIALIZED IN:</text>
      
      <circle cx="20" cy="46" r="3" fill="#22C55E"/>
      <text x="32" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">Speed Governor (Electronic &amp; Cable)</text>

      <circle cx="20" cy="70" r="3" fill="#3B82F6"/>
      <text x="32" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">GPS Tracking &amp; Live Monitoring</text>

      <circle cx="20" cy="94" r="3" fill="#EA580C"/>
      <text x="32" y="98" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">VLT GPS / AIS-140 Devices</text>

      <circle cx="20" cy="118" r="3" fill="#DC2626"/>
      <text x="32" y="122" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">Fuel Monitoring &amp; Fly-by-wire</text>

      <circle cx="20" cy="140" r="3" fill="#A855F7"/>
      <text x="32" y="144" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">Vehicle Electronic Devices</text>
    </g>

    <!-- Contact & Location Box (Right Side) -->
    <g transform="translate(345, 125)">
      <!-- Phone section -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#1E3A8A"/>
        <text x="16" y="22" font-family="'Inter', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">📞</text>
        <text x="44" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Contact Numbers</text>
        <text x="44" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">9979307549 / 9924944111</text>
      </g>

      <!-- Email section -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#9A3412"/>
        <text x="16" y="22" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">✉️</text>
        <text x="44" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Email Inquiries</text>
        <text x="44" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">mahienterprise2131@gmail.com</text>
      </g>

      <!-- Location section -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#14532D"/>
        <text x="16" y="22" font-family="'Inter', sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">📍</text>
        <text x="44" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Locations</text>
        <text x="44" y="27" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Subhas Bridge, RTO Circle, Ahmedabad</text>
        <text x="44" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#CBD5E1">Sec-3, RTO Gandhinagar (Kalol - N.G.)</text>
      </g>
    </g>

    <!-- Bottom verification strip -->
    <rect x="45" y="295" width="560" height="42" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
    <text x="60" y="321" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#22C55E">✓ RTO &amp; Transport Authorized Solutions</text>
    <text x="350" y="321" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8">✓ Complete Installation &amp; Support</text>
  </g>
</svg>
