<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sgShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B1528" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="250" cy="200" r="140" fill="#EA580C" opacity="0.08" filter="blur(20px)"/>

  <g filter="url(#sgShadow)">
    <!-- Speed Governor Main Controller Housing -->
    <rect x="80" y="80" width="220" height="230" rx="16" fill="url(#metalGrad)" stroke="#475569" stroke-width="3"/>

    <!-- Cast Metal Bolt Ears -->
    <circle cx="95" cy="95" r="7" fill="#0B132B" stroke="#64748B" stroke-width="2"/>
    <circle cx="285" cy="95" r="7" fill="#0B132B" stroke="#64748B" stroke-width="2"/>
    <circle cx="95" cy="295" r="7" fill="#0B132B" stroke="#64748B" stroke-width="2"/>
    <circle cx="285" cy="295" r="7" fill="#0B132B" stroke="#64748B" stroke-width="2"/>

    <!-- Controller Plate Label -->
    <rect x="105" y="115" width="170" height="90" rx="8" fill="#0B132B" stroke="#334155" stroke-width="1.5"/>
    <rect x="115" y="125" width="150" height="22" rx="4" fill="#DC2626"/>
    <text x="190" y="140" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SPEED GOVERNOR</text>
    <text x="190" y="160" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#E2E8F0" text-anchor="middle">MAHI ENTERPRISE</text>
    <text x="190" y="174" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8" text-anchor="middle">RTO &amp; TAC COMPLIANT</text>
    <text x="190" y="188" font-family="'Inter', sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">ELECTRONIC / CABLE TYPE</text>

    <!-- Speed Dial Gauge on Controller -->
    <g transform="translate(190, 250)">
      <circle cx="0" cy="0" r="32" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
      <path d="M-22 14 A26 26 0 1 1 22 14" stroke="#475569" stroke-width="3" fill="none"/>
      <path d="M-22 14 A26 26 0 0 1 -10 -24" stroke="#16A34A" stroke-width="3" fill="none"/>
      <path d="M-10 -24 A26 26 0 0 1 12 -23" stroke="#EA580C" stroke-width="3" fill="none"/>
      <path d="M12 -23 A26 26 0 0 1 22 14" stroke="#DC2626" stroke-width="3" fill="none"/>
      <!-- Gauge Needle pinned at 80 km/h limit -->
      <line x1="0" y1="0" x2="14" y2="-18" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#F8FAFC" text-anchor="middle">80 KM/H</text>
    </g>

    <!-- Actuator Unit / Motor Cylinder (Right Side) -->
    <g transform="translate(320, 110)">
      <rect x="0" y="0" width="85" height="150" rx="14" fill="#1E293B" stroke="#475569" stroke-width="3"/>
      <!-- Stepper motor cooling rings -->
      <line x1="10" y1="30" x2="75" y2="30" stroke="#334155" stroke-width="3"/>
      <line x1="10" y1="50" x2="75" y2="50" stroke="#334155" stroke-width="3"/>
      <line x1="10" y1="70" x2="75" y2="70" stroke="#334155" stroke-width="3"/>
      <line x1="10" y1="90" x2="75" y2="90" stroke="#334155" stroke-width="3"/>
      <line x1="10" y1="110" x2="75" y2="110" stroke="#334155" stroke-width="3"/>

      <!-- Solenoid Brass Cap -->
      <rect x="15" y="-20" width="55" height="22" rx="4" fill="url(#goldBrass)" stroke="#B45309" stroke-width="1.5"/>
      <rect x="25" y="-32" width="35" height="14" rx="3" fill="#64748B"/>
      <circle cx="42.5" cy="-25" r="4" fill="#0F172A"/>

      <!-- Mechanical Bowden Cable / Throttle Actuation -->
      <path d="M42.5 150 Q45 220 10 240" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M42.5 150 Q45 220 10 240" stroke="#94A3B8" stroke-width="3" fill="none" stroke-dasharray="3 3"/>
    </g>

    <!-- Cable Links between ECU and Actuator -->
    <path d="M300 160 C310 160 310 160 320 160" stroke="#000000" stroke-width="8"/>
    <path d="M300 220 C310 220 310 220 320 220" stroke="#000000" stroke-width="8"/>

    <!-- External Wiring Harness & Fly-By-Wire Connectors -->
    <g transform="translate(140, 310)">
      <rect x="0" y="0" width="100" height="20" rx="4" fill="#334155"/>
      <path d="M20 20 Q15 65 -40 70" stroke="#DC2626" stroke-width="4.5" fill="none"/>
      <path d="M40 20 Q35 70 0 75" stroke="#16A34A" stroke-width="4.5" fill="none"/>
      <path d="M60 20 Q65 70 40 75" stroke="#2563EB" stroke-width="4.5" fill="none"/>
      <path d="M80 20 Q85 65 140 70" stroke="#EA580C" stroke-width="4.5" fill="none"/>
    </g>
  </g>
</svg>
