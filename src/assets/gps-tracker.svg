<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B1528" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="200" r="150" fill="#3B82F6" opacity="0.08" filter="blur(20px)"/>

  <!-- Device Shadow and Chassis -->
  <g filter="url(#shadow)">
    <!-- Main Device Body -->
    <rect x="140" y="70" width="220" height="260" rx="28" fill="url(#bodyGrad)" stroke="#334155" stroke-width="3"/>
    
    <!-- Inner Inset Texture -->
    <rect x="156" y="86" width="188" height="228" rx="20" fill="#0B132B" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Heat Dissipation Ribs -->
    <line x1="130" y1="120" x2="140" y2="120" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="150" x2="140" y2="150" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="180" x2="140" y2="180" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="210" x2="140" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <line x1="360" y1="120" x2="370" y2="120" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="150" x2="370" y2="150" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="180" x2="370" y2="180" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="210" x2="370" y2="210" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <!-- Wiring Harness / Connector Port -->
    <rect x="210" y="328" width="80" height="24" rx="4" fill="#334155"/>
    <path d="M225 352 Q210 390 170 395" stroke="#DC2626" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M240 352 Q240 395 230 400" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M255 352 Q260 395 285 398" stroke="#EA580C" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M270 352 Q290 390 330 395" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Antenna Nipple -->
    <rect x="235" y="55" width="30" height="16" rx="4" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <line x1="250" y1="55" x2="250" y2="40" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

    <!-- Top Badge / Branding on Device -->
    <rect x="175" y="105" width="150" height="42" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="250" y="125" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MAHI ENTERPRISE</text>
    <text x="250" y="139" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">GPS SMART TRACKER</text>

    <!-- LED Status Indicators -->
    <g transform="translate(180, 165)">
      <!-- GPS LED -->
      <circle cx="20" cy="15" r="5" fill="#22C55E"/>
      <circle cx="20" cy="15" r="9" fill="#22C55E" opacity="0.3"/>
      <text x="36" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">GPS</text>

      <!-- GSM LED -->
      <circle cx="80" cy="15" r="5" fill="#3B82F6"/>
      <circle cx="80" cy="15" r="9" fill="#3B82F6" opacity="0.3"/>
      <text x="96" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">GSM</text>

      <!-- PWR LED -->
      <circle cx="140" cy="15" r="5" fill="#EA580C"/>
      <circle cx="140" cy="15" r="9" fill="#EA580C" opacity="0.3"/>
      <text x="156" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">PWR</text>
    </g>

    <!-- Center Radar Graphic -->
    <g transform="translate(250, 240)">
      <circle cx="0" cy="0" r="38" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="14" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8"/>
      <!-- Sweep line -->
      <line x1="0" y1="0" x2="22" y2="-22" stroke="#22C55E" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#3B82F6"/>
      <circle cx="16" cy="-14" r="2.5" fill="#22C55E"/>
    </g>

    <text x="250" y="298" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">REAL-TIME TELEMATICS UNIT</text>
  </g>
</svg>
