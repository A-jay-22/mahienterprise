<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Dark Tech Backdrop -->
  <rect width="600" height="450" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Map Grid lines -->
  <path d="M50 100 L550 100 M50 200 L550 200 M50 300 L550 300 M50 400 L550 400" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M100 50 L100 400 M250 50 L250 400 M400 50 L400 400 M550 50 L550 400" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Satellite Orbiting at top -->
  <g transform="translate(480, 50)">
    <circle cx="0" cy="0" r="30" fill="#1D4ED8" opacity="0.15"/>
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#38BDF8"/>
    <!-- Solar Panels -->
    <rect x="-35" y="-6" width="20" height="12" rx="2" fill="#2563EB" stroke="#60A5FA" stroke-width="1"/>
    <rect x="15" y="-6" width="20" height="12" rx="2" fill="#2563EB" stroke="#60A5FA" stroke-width="1"/>
    <!-- Signal Beams -->
    <path d="M-5 12 L-300 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
    <path d="M0 12 L-180 270" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
    <path d="M5 12 L-50 290" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  </g>

  <!-- Route Line (GPS Breadcrumb Trail) -->
  <path d="M120 290 C 200 240, 240 320, 320 270 S 440 220, 500 280" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 290 C 200 240, 240 320, 320 270 S 440 220, 500 280" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Commercial Heavy Vehicle / Truck (Left) -->
  <g transform="translate(90, 230)">
    <!-- Cabin & Trailer -->
    <rect x="0" y="30" width="70" height="40" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="72" y="10" width="48" height="60" rx="6" fill="#1D4ED8" stroke="#3B82F6" stroke-width="2"/>
    <rect x="90" y="20" width="24" height="20" rx="3" fill="#93C5FD"/>
    <!-- Wheels -->
    <circle cx="20" cy="74" r="10" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="50" cy="74" r="10" fill="#020617" stroke="#475569" stroke-width="3"/>
    <circle cx="98" cy="74" r="10" fill="#020617" stroke="#475569" stroke-width="3"/>
    
    <!-- GPS Tag / Speed Governor Badge -->
    <g transform="translate(60, -25)">
      <rect x="-50" y="0" width="100" height="24" rx="12" fill="#0B132B" stroke="#EA580C" stroke-width="1.5"/>
      <circle cx="-38" cy="12" r="4" fill="#EA580C"/>
      <text x="5" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">SPEED GOV: 60 KM/H</text>
    </g>
  </g>

  <!-- Passenger Car / Fleet Vehicle (Center) -->
  <g transform="translate(290, 260)">
    <!-- Car body -->
    <path d="M10 20 L25 5 L65 5 L85 20 L95 24 L95 38 L0 38 L0 25 Z" fill="#DC2626" stroke="#EF4444" stroke-width="1.5"/>
    <!-- Windows -->
    <polygon points="28,8 45,8 45,18 20,18" fill="#FEE2E2" opacity="0.7"/>
    <polygon points="50,8 62,8 75,18 50,18" fill="#FEE2E2" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="22" cy="38" r="8" fill="#020617" stroke="#64748B" stroke-width="2"/>
    <circle cx="76" cy="38" r="8" fill="#020617" stroke="#64748B" stroke-width="2"/>

    <!-- GPS Tag -->
    <g transform="translate(45, -30)">
      <rect x="-45" y="0" width="90" height="24" rx="12" fill="#0B132B" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="-33" cy="12" r="4" fill="#22C55E"/>
      <text x="6" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#22C55E" text-anchor="middle">LIVE: 48 KM/H</text>
    </g>
  </g>

  <!-- Bus / Transport Vehicle (Right) -->
  <g transform="translate(440, 240)">
    <!-- Bus body -->
    <rect x="0" y="10" width="110" height="55" rx="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <!-- Windows -->
    <rect x="10" y="18" width="18" height="16" rx="2" fill="#E0F2FE"/>
    <rect x="34" y="18" width="18" height="16" rx="2" fill="#E0F2FE"/>
    <rect x="58" y="18" width="18" height="16" rx="2" fill="#E0F2FE"/>
    <rect x="82" y="18" width="20" height="24" rx="2" fill="#E0F2FE"/>
    <!-- Wheels -->
    <circle cx="26" cy="68" r="9" fill="#020617" stroke="#475569" stroke-width="2"/>
    <circle cx="85" cy="68" r="9" fill="#020617" stroke="#475569" stroke-width="2"/>

    <!-- VLT GPS Badge -->
    <g transform="translate(55, -25)">
      <rect x="-45" y="0" width="90" height="24" rx="12" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
      <circle cx="-33" cy="12" r="4" fill="#3B82F6"/>
      <text x="6" y="15" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#93C5FD" text-anchor="middle">VLT AIS 140 ACTIVE</text>
    </g>
  </g>

  <!-- Live Telematics HUD Overlay Cards -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="170" height="60" rx="12" fill="#0B1528" stroke="#1D4ED8" stroke-width="1.5" opacity="0.95"/>
    <circle cx="24" cy="30" r="12" fill="#1D4ED8" opacity="0.2"/>
    <circle cx="24" cy="30" r="6" fill="#3B82F6"/>
    <text x="46" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#94A3B8">FLEET STATUS</text>
    <text x="46" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#22C55E">100% ONLINE</text>
  </g>

  <g transform="translate(220, 30)">
    <rect x="0" y="0" width="170" height="60" rx="12" fill="#0B1528" stroke="#EA580C" stroke-width="1.5" opacity="0.95"/>
    <circle cx="24" cy="30" r="12" fill="#EA580C" opacity="0.2"/>
    <polygon points="24,22 28,34 20,34" fill="#EA580C"/>
    <text x="46" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#94A3B8">SPEED GOVERNOR</text>
    <text x="46" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF">COMPLIANT</text>
  </g>
</svg>
