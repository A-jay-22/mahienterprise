<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="vltBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="vltShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B1528" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <circle cx="250" cy="200" r="140" fill="#16A34A" opacity="0.08" filter="blur(20px)"/>

  <g filter="url(#vltShadow)">
    <!-- Main Device IP67 Sealed Box -->
    <rect x="130" y="60" width="240" height="280" rx="20" fill="url(#vltBody)" stroke="#334155" stroke-width="3"/>

    <!-- Perimeter Corner Hex Bolts -->
    <circle cx="148" cy="78" r="5" fill="#475569" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="352" cy="78" r="5" fill="#475569" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="148" cy="322" r="5" fill="#475569" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="352" cy="322" r="5" fill="#475569" stroke="#64748B" stroke-width="1.5"/>

    <!-- Compliance / Spec Label -->
    <rect x="155" y="95" width="190" height="85" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="165" y="105" width="170" height="22" rx="4" fill="#16A34A"/>
    <text x="250" y="120" font-family="'Inter', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VLT GPS TRACKING</text>
    <text x="250" y="142" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#F8FAFC" text-anchor="middle">MAHI ENTERPRISE</text>
    <text x="250" y="158" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">AIS-140 / IRNSS COMPLIANT</text>
    <text x="250" y="172" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#22C55E" text-anchor="middle">RTO APPROVED STANDARDS</text>

    <!-- Internal Modules Graphic (eSIM / NavIC) -->
    <g transform="translate(160, 195)">
      <!-- eSIM Card Slot -->
      <rect x="0" y="0" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <rect x="10" y="10" width="30" height="40" rx="3" fill="#D97706"/>
      <text x="45" y="26" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#E2E8F0">DUAL</text>
      <text x="45" y="38" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#38BDF8">eSIM</text>

      <!-- NavIC / GPS Module -->
      <rect x="95" y="0" width="85" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <circle cx="115" cy="30" r="12" fill="#0B132B" stroke="#22C55E" stroke-width="1.5"/>
      <polygon points="115,22 120,34 110,34" fill="#22C55E"/>
      <text x="135" y="26" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#E2E8F0">NavIC</text>
      <text x="135" y="38" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#94A3B8">GNSS</text>
    </g>

    <!-- Status Diagnostic LEDs -->
    <g transform="translate(170, 275)">
      <circle cx="15" cy="15" r="4" fill="#22C55E"/>
      <text x="25" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">NAV</text>
      
      <circle cx="65" cy="15" r="4" fill="#3B82F6"/>
      <text x="75" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">GSM</text>

      <circle cx="115" cy="15" r="4" fill="#DC2626"/>
      <text x="125" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">SOS</text>
    </g>

    <!-- IP67 Waterproof Glands / Harness Output -->
    <g transform="translate(200, 340)">
      <rect x="0" y="0" width="35" height="24" rx="4" fill="#334155"/>
      <rect x="65" y="0" width="35" height="24" rx="4" fill="#334155"/>
      <path d="M17.5 24 Q10 50 -20 55" stroke="#1D4ED8" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M82.5 24 Q90 50 120 55" stroke="#DC2626" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Emergency Panic SOS Button attachment -->
    <g transform="translate(380, 240)">
      <rect x="0" y="0" width="45" height="55" rx="8" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
      <circle cx="22.5" cy="25" r="12" fill="#B91C1C"/>
      <text x="22.5" y="29" font-family="'Inter', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">SOS</text>
      <text x="22.5" y="47" font-family="'Inter', sans-serif" font-size="7" fill="#FEE2E2" text-anchor="middle">PANIC</text>
      <path d="M0 25 L-20 25" stroke="#DC2626" stroke-width="3" stroke-dasharray="2 2"/>
    </g>
  </g>
</svg>
